function load(){try{const r=localStorage.getItem(“c60v6”);return r?JSON.parse(r):{}}catch{return{}}}
function save(s){try{localStorage.setItem(“c60v6”,JSON.stringify(s))}catch{}}

const TODAY=new Date().toISOString().split(“T”)[0];
const QUOTE=QUOTES[Math.floor((new Date()-START)/86400000)%QUOTES.length];

function dayNum(){return Math.max(1,Math.min(Math.floor((new Date()-START)/86400000)+1,60));}
function weekStart(ds){const d=new Date(ds),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);return new Date(d.setDate(diff)).toISOString().split(“T”)[0];}
function dayState(){return STATE[TODAY]||{};}
function allTasks(){return DOMAINS.flatMap(d=>d.tasks);}

// ── SCORING ───────────────────────────────────────────────────────────────────
function taskCount(day){
const tasks=STATE[day]?.tasks||{},at=allTasks();
let c=0,v=0;
Object.entries(tasks).forEach(([k,ok])=>{if(ok){const t=at.find(x=>x.id===k);if(t){c+=t.star?2:1;v+=t.star?200:100;}}});
return{c,v};
}
function calcStats(){
let tt=0,tv=0,dc=0,pen=0;
Object.keys(STATE).forEach(day=>{
const{c,v}=taskCount(day);const ds=STATE[day]||{};
tt+=c;tv+=v;if(c>=8)dc++;
pen+=HABITS.filter(h=>!(ds.habits||{})[h.id]).length*200;
if(day<TODAY){if(c<8&&c>0)pen+=500;if(c===0)pen+=1000;}
});
return{tt,tv,dc,pen,net:Math.max(0,tv-pen)};
}
function calcStreak(){
let streak=0;const d=new Date(TODAY);
while(true){
const key=new Date(d).toISOString().split(“T”)[0];
if(taskCount(key).c>=8)streak++;else break;
d.setDate(d.getDate()-1);
if(streak>60)break;
}
return streak;
}
function calcLevel(tt){
let lv=LEVELS[0];for(const l of LEVELS){if(tt>=l.min)lv=l;}return lv;
}
function calcGrade(){
const ws=weekStart(TODAY);
const days=Object.keys(STATE).filter(d=>d>=ws&&d<=TODAY);
if(!days.length)return{grade:”—”,color:”#9ca3af”,score:0};
let totT=0,totH=0,totPen=0;
days.forEach(day=>{
const{c}=taskCount(day);const ds=STATE[day]||{};
totT+=c;totH+=HABITS.filter(h=>(ds.habits||{})[h.id]).length;
if(day<TODAY){if(c<8&&c>0)totPen+=500;if(c===0)totPen+=1000;}
});
const ts=Math.min(100,(totT/(days.length*8))*60);
const hs=(totH/(days.length*4))*30;
const ps=Math.max(0,10-totPen/200);
const sc=Math.round(ts+hs+ps);
let g=“F”,c=”#ef4444”;
if(sc>=95){g=“A+”;c=”#10b981”;}else if(sc>=85){g=“A”;c=”#10b981”;}
else if(sc>=75){g=“B+”;c=”#60a5fa”;}else if(sc>=65){g=“B”;c=”#60a5fa”;}
else if(sc>=55){g=“C”;c=”#fbbf24”;}else if(sc>=40){g=“D”;c=”#f97316”;}
return{grade:g,color:c,score:sc};
}
function domainStrengths(){
const ws=weekStart(TODAY);
const days=Object.keys(STATE).filter(d=>d>=ws&&d<=TODAY);
return DOMAINS.map(domain=>{
let done=0,total=0;
days.forEach(day=>{
const tasks=STATE[day]?.tasks||{};
domain.tasks.forEach(t=>{total++;if(tasks[t.id])done++;});
});
return{id:domain.id,name:domain.name,emoji:domain.emoji,pct:total?Math.round((done/total)*100):0,color:dc(domain)};
});
}
function calcProjection(S){
const dn=dayNum();if(dn<2||S.net<=0)return null;
const rate=S.net/dn;
return{projected:Math.round(rate*60),daysLeft:60-dn,rate:Math.round(rate),onTrack:rate*60>=45000};

function weeklyHistory(){
const result=[];
for(let w=0;w<4;w++){
const ws=new Date(TODAY);ws.setDate(ws.getDate()-w*7);
const wsKey=weekStart(ws.toISOString().split(“T”)[0]);
const days=[];
for(let d=0;d<7;d++){
const dk=new Date(wsKey);dk.setDate(dk.getDate()+d);
const key=dk.toISOString().split(“T”)[0];
if(key<=TODAY)days.push(taskCount(key).c);
}

result.unshift({label:`W${4-w}`,avg,days});
}

}

// ── MISSION GEN ───────────────────────────────────────────────────────────────
function genMission(){
const ws=weekStart(TODAY);
const wdays=Object.keys(STATE).filter(d=>d>=ws&&d<TODAY);
const wc={};let ws2=0;
wdays.forEach(day=>{
Object.entries(STATE[day]?.tasks||{}).forEach(([id,done])=>{
if(done){wc[id]=(wc[id]||0)+1;if(allTasks().find(t=>t.id===id)?.star)ws2++;}
});
});
const m={};let ts=0;
DOMAINS.forEach(domain=>{
const elig=domain.tasks.filter(t=>{
if((wc[t.id]||0)>=2)return false;
if(t.star&&(ws2>=2||ts>=1))return false;
return true;
}).sort(()=>Math.random()-0.5);
const picked=[];
const st=elig.find(t=>t.star&&ts<1&&ws2<2);
if(st){picked.push(st);ts++;ws2++;}
const rest=elig.filter(t=>!picked.includes(t)&&!t.star);
while(picked.length<2&&rest.length>0)picked.push(rest.shift());
if(picked.length<2){const fb=domain.tasks.filter(t=>!picked.includes(t)).sort(()=>Math.random()-0.5);while(picked.length<2&&fb.length>0)picked.push(fb.shift());}
m[domain.id]=picked;
});
return m;
}

else if(p.shape===“circle”){cx.beginPath();cx.arc(0,0,p.size/2,0,Math.PI*2);cx.fill();}
else{cx.beginPath();for(let i=0;i<5;i++){cx.lineTo(Math.cos((18+i*72)*Math.PI/180)*p.size/2,Math.sin((18+i*72)*Math.PI/180)*p.size/2);cx.lineTo(Math.cos((54+i*72)*Math.PI/180)*p.size/4,Math.sin((54+i*72)*Math.PI/180)*p.size/4);}cx.closePath();cx.fill();}

function drawRadar(strengths,size=170){

const gpoly=f=>angles.map(a=>`${cx2+r*f*Math.cos(a)},${cy2+r*f*Math.sin(a)}`).join(” “);
const dpoly=pts.map(p=>`${p.x},${p.y}`).join(” “);
const gc=DARK?”#2a1a3a”:”#e8e4f8”;
const fc=DARK?”#C084FC22”:”#7C3AED15”;

return`<svg width="${size}" height="${size}" style="overflow:visible;display:block;margin:0 auto"> ${[.25,.5,.75,1].map(f=>`<polygon points="${gpoly(f)}" fill="none" stroke="${gc}" stroke-width="1"/>`).join("")} ${angles.map(a=>`<line x1="${cx2}" y1="${cy2}" x2="${cx2+r*Math.cos(a)}" y2="${cy2+r*Math.sin(a)}" stroke="${gc}" stroke-width="1"/>`).join("")} <polygon points="${dpoly}" fill="${fc}" stroke="${sc}" stroke-width="2.5" stroke-linejoin="round"/> ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${p.color}"/>`).join("")} ${pts.map(p=>`<text x="${p.lx}" y="${p.ly}" text-anchor="middle" dominant-baseline="middle" font-size="15">${p.emoji}</text>`).join("")} </svg>`;
}

</div>

<!-- Domain breakdown -->
<div class="slabel" style="color:${t.slabel}">Domain Strengths This Week</div>

<!-- Milestones achieved -->

window.setView=v=>{VIEW=v;render();}
window.toggleDomain=id=>{EXP=EXP===id?null:id;render();}

window.handleHabit=(id,e)=>{const r=e.currentTarget?.getBoundingClientRect?.();doHabit(id,r?r.left+r.width/2:window.innerWidth/2,r?r.top+r.height/2:window.innerHeight/3);}

applyBody();
